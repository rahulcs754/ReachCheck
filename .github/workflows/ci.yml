name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "Run npm run build and commit dist/" && exit 1)

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Action on the fixture app
        id: reach
        uses: ./
        with:
          working-directory: test/fixtures/next-app
          alerts-file: test/fixtures/next-app/alerts.json
          vex-file: reachcheck.vex.json
      - name: Check outputs
        run: |
          test "${{ steps.reach.outputs.alerts }}" = "10"
          test "${{ steps.reach.outputs.reachable }}" = "3"
          test "${{ steps.reach.outputs.called }}" = "2"
          test "${{ steps.reach.outputs.client }}" = "1"
          test -s reachcheck.vex.json
